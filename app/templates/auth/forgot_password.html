{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-box mx-auto my-md-4">
  <div class="panel p-4 p-md-5">
    <h3 class="mb-2">Forgot your password?</h3>
    <p class="text-muted small">Enter your account email and we will send a password reset link.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control mb-3" required autofocus>
      <button type="submit" class="btn btn-primary w-100">Send reset link</button>
    </form>
    <p class="mt-4 mb-0 text-center small"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
  </div>
</div>
{% endblock %}
