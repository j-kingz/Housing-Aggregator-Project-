{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-box mx-auto">
  <h2 class="mb-1">Create an account</h2>
  <p class="text-muted mb-4">It only takes a minute.</p>

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label d-block">I am a</label>
      <div class="btn-group w-100" role="group">
        <input type="radio" class="btn-check" name="account_type" id="typeRenter" value="Renter"
               {% if form.get('account_type', 'Renter') == 'Renter' %}checked{% endif %}>
        <label class="btn btn-outline-primary" for="typeRenter">Renter</label>

        <input type="radio" class="btn-check" name="account_type" id="typeLandlord" value="Landlord"
               {% if form.get('account_type') == 'Landlord' %}checked{% endif %}>
        <label class="btn btn-outline-primary" for="typeLandlord">Landlord</label>
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="firstname">First name</label>
        <input type="text" id="firstname" name="firstname" class="form-control" maxlength="50"
               value="{{ form.get('firstname', '') }}" required>
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="lastname">Last name</label>
        <input type="text" id="lastname" name="lastname" class="form-control" maxlength="50"
               value="{{ form.get('lastname', '') }}" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control" maxlength="100"
             value="{{ form.get('email', '') }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="phonenumber">Phone number <span class="text-muted">(optional)</span></label>
      <input type="tel" id="phonenumber" name="phonenumber" class="form-control" maxlength="20"
             placeholder="07XX XXX XXX" value="{{ form.get('phonenumber', '') }}">
    </div>

    <div class="mb-3">
      <label class="form-label" for="businessname">Business name <span class="text-muted">(landlords, optional)</span></label>
      <input type="text" id="businessname" name="businessname" class="form-control" maxlength="100"
             value="{{ form.get('businessname', '') }}">
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" minlength="8" required>
      <div class="form-text">At least 8 characters.</div>
    </div>

    <div class="mb-4">
      <label class="form-label" for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>

  <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
