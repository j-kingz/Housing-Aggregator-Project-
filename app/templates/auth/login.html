{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-box mx-auto my-md-4">
  <div class="panel p-4 p-md-5">
    <div class="text-center mb-4">
      <span class="icon-box mb-3"><i class="bi bi-house-heart"></i></span>
      <h3 class="mb-1">Welcome back</h3>
      <p class="text-muted small mb-0">Log in to manage your listings and profile</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ email }}" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
    </form>

    <p class="mt-3 mb-0 text-center small"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
    <p class="mt-4 mb-0 text-center small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
