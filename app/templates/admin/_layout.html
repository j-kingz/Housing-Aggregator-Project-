{% extends "base.html" %}
{% block content %}
{% set page = request.endpoint %}
<div class="d-flex align-items-center gap-3 mb-4">
  <span class="icon-box"><i class="bi bi-shield-lock"></i></span>
  <div>
    <h2 class="mb-0">Admin</h2>
    <span class="text-muted small">Manage users and listings</span>
  </div>
</div>

<ul class="nav nav-pills admin-tabs mb-4">
  <li class="nav-item">
    <a class="nav-link {{ 'active' if page == 'admin.dashboard' }}" href="{{ url_for('admin.dashboard') }}"><i class="bi bi-speedometer2 me-1"></i>Overview</a>
  </li>
  <li class="nav-item">
    <a class="nav-link {{ 'active' if page == 'admin.users' }}" href="{{ url_for('admin.users') }}"><i class="bi bi-people me-1"></i>Users</a>
  </li>
  <li class="nav-item">
    <a class="nav-link {{ 'active' if page == 'admin.listings' }}" href="{{ url_for('admin.listings') }}"><i class="bi bi-buildings me-1"></i>Listings</a>
  </li>
</ul>

{% block admin_content %}{% endblock %}
{% endblock %}
