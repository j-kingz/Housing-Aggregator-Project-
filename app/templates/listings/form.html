{% extends "base.html" %}
{% block title %}{{ 'Edit listing' if editing else 'Add listing' }}{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 680px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <span class="icon-box"><i class="bi {{ 'bi-pencil-square' if editing else 'bi-plus-square' }}"></i></span>
    <div>
      <h2 class="mb-0">{{ 'Edit listing' if editing else 'Add a listing' }}</h2>
      <span class="text-muted small">Fields marked * are required</span>
    </div>
  </div>

  <form method="post" class="panel p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label" for="title">Title *</label>
      <input type="text" id="title" name="title" class="form-control" maxlength="150"
             placeholder="e.g. Spacious 2 bedroom near Yaya Centre" value="{{ listing.title or '' }}" required>
    </div>

    <div class="row">
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="rentamount">Rent per month *</label>
        <div class="input-group">
          <span class="input-group-text">KSh</span>
          <input type="number" id="rentamount" name="rentamount" class="form-control" min="1" step="any"
                 value="{{ listing.rentamount or '' }}" required>
        </div>
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="category">Category *</label>
        <select id="category" name="category" class="form-select" required>
          <option value="">Choose...</option>
          {% for c in categories %}
            <option value="{{ c }}" {% if listing.category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label" for="bedrooms">Bedrooms</label>
        <input type="number" id="bedrooms" name="bedrooms" class="form-control" min="0" max="50"
               value="{{ listing.bedrooms if listing.bedrooms is not none else '' }}">
      </div>
      <div class="col-6 mb-3">
        <label class="form-label" for="bathrooms">Bathrooms</label>
        <input type="number" id="bathrooms" name="bathrooms" class="form-control" min="0" max="50"
               value="{{ listing.bathrooms if listing.bathrooms is not none else '' }}">
      </div>
    </div>

    <div class="row">
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="address">Area / estate</label>
        <input type="text" id="address" name="address" class="form-control" maxlength="150"
               placeholder="e.g. Kilimani" value="{{ listing.address or '' }}">
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="city">City *</label>
        <input type="text" id="city" name="city" class="form-control" maxlength="50"
               placeholder="e.g. Nairobi" value="{{ listing.city or '' }}" required>
      </div>
    </div>

    <h6 class="border-top pt-3 mt-2">Exact unit location and availability</h6>
    <div class="row">
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="building_name">Building name</label>
        <input type="text" id="building_name" name="building_name" class="form-control" maxlength="150"
               placeholder="e.g. Riverside Towers" value="{{ listing.building_name or '' }}">
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="room_number">Room / unit number</label>
        <input type="text" id="room_number" name="room_number" class="form-control" maxlength="30"
               placeholder="e.g. 4B" value="{{ listing.room_number or '' }}">
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="floor_number">Floor number</label>
        <input type="number" id="floor_number" name="floor_number" class="form-control" min="-5" max="200"
               placeholder="e.g. 4" value="{{ listing.floor_number if listing.floor_number is not none else '' }}">
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="availability_status">Availability</label>
        <select id="availability_status" name="availability_status" class="form-select">
          {% for key, label in availability_statuses.items() %}
            <option value="{{ key }}" {% if (listing.availability_status or 'unknown') == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label" for="buildingnumber">Building / house number <span class="text-muted">(optional)</span></label>
      <input type="text" id="buildingnumber" name="buildingnumber" class="form-control" maxlength="20"
             value="{{ listing.buildingnumber or '' }}">
    </div>

    <div class="d-flex gap-2 border-top pt-3">
      <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2 me-1"></i> {{ 'Save changes' if editing else 'Add listing' }}</button>
      <a href="{{ url_for('listings.detail', listing_id=listing_id) if editing else url_for('listings.my_listings') }}"
         class="btn btn-light">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
