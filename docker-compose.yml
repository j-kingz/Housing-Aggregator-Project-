# The Housing Aggregator, running in containers.
#
#   docker compose up --build          start everything
#   docker compose run --rm scraper    run the scraper once
#   docker compose logs -f web         watch the site
#
# The web container and the scraper container are separate on purpose: a long
# scrape should never slow the site down (proposal 3.7.4).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      MYSQL_DATABASE: ${DB_NAME:-housing_aggregator_db}
    ports:
      # 3307 on your computer, so it does not clash with a MySQL already using 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. MySQL first runs a temporary start-up
      # server that only listens on a socket, which must not count as "healthy".
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      FLASK_DEBUG: "0"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_BASE_URL: ${MPESA_CALLBACK_BASE_URL:-}
      MPESA_RESERVATION_PERCENT: ${MPESA_RESERVATION_PERCENT:-10}
      PREMIUM_SUBSCRIPTION_AMOUNT: ${PREMIUM_SUBSCRIPTION_AMOUNT:-500}
      PREMIUM_SUBSCRIPTION_DAYS: ${PREMIUM_SUBSCRIPTION_DAYS:-30}
      VERIFICATION_DEADLINE_HOURS: ${VERIFICATION_DEADLINE_HOURS:-24}
      VERIFICATION_MAX_REASSIGNMENTS: ${VERIFICATION_MAX_REASSIGNMENTS:-2}
      # email (password reset links, payment receipts)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAIL_SENDER: ${MAIL_SENDER:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-housing_aggregator_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python init_db.py && python run.py"
    healthcheck:
      # healthy once the tables exist and the site answers
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  scraper:
    build: .
    command: python -m scraper.worker --every 30
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      # the worker also enforces vacancy check deadlines; keep these the same as web
      VERIFICATION_DEADLINE_HOURS: ${VERIFICATION_DEADLINE_HOURS:-24}
      VERIFICATION_MAX_REASSIGNMENTS: ${VERIFICATION_MAX_REASSIGNMENTS:-2}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-housing_aggregator_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  db_data:
